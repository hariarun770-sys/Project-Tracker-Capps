<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneNex Phase 2 — Scope, Architecture & Release Roadmap Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: auto;
    }

    /* TOP UTILITY / NAV BAR */
    .top-nav-bar {
      width: 1536px;
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 18px;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 10px;
      z-index: 100;
    }

    .top-nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .top-nav-link:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #ffffff;
    }

    .scope-tabs-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .scope-tab-btn {
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 800;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      background: transparent;
      transition: all 0.2s ease;
    }

    .scope-tab-btn:hover {
      color: #f1f5f9;
    }

    .scope-tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.45);
    }

    .top-nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-export-retina {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }
    .btn-export-retina:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.6);
    }

    .card-frame-container {
      width: 1536px;
      min-width: 1536px;
      display: flex;
      justify-content: center;
    }

    .scope-pane {
      display: none;
      width: 100%;
    }

    .scope-pane.active {
      display: block;
    }

    .card-frame {
      width: 1536px;
      height: 1080px;
      border: none;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- TOP UTILITY / NAV BAR -->
  <div class="top-nav-bar">
    <div class="top-nav-left">
      <a href="../index.html" class="top-nav-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Portfolio Tracker
      </a>
      <div class="scope-tabs-group">
        <button class="scope-tab-btn active" id="tabRoadmap" onclick="switchScope('roadmap')">
          <i class="fa-solid fa-map"></i> 1. OneNex 2.0 Release Roadmap
        </button>
        <button class="scope-tab-btn" id="tabArch" onclick="switchScope('arch')">
          <i class="fa-solid fa-cubes"></i> 2. Foundation Microservices Architecture
        </button>
      </div>
    </div>
    <div class="top-nav-actions">
      <button class="btn-export-retina" onclick="exportActiveScope()">
        <i class="fa-solid fa-camera"></i> <span id="exportBtnTxt">Export Roadmap JPG</span>
      </button>
    </div>
  </div>

  <div class="card-frame-container">
    <!-- Pane 1: OneNex 2.0 Monthly Production Release Roadmap (Default Active) -->
    <div class="scope-pane active" id="paneRoadmap">
      <iframe class="card-frame" id="frameRoadmap" src="OneNex_2.0_Monthly_Production_Release_Roadmap.html"></iframe>
    </div>

    <!-- Pane 2: Foundation Microservices Architecture Spec -->
    <div class="scope-pane" id="paneArch">
      <iframe class="card-frame" id="frameArch" src="OneNex_Phase_2_Scope_Architecture.html"></iframe>
    </div>
  </div>

  <script>
    let currentScope = 'roadmap';

    const tabMap = {
      roadmap: { tabId: 'tabRoadmap', paneId: 'paneRoadmap', frameId: 'frameRoadmap', btnText: 'Export Roadmap JPG' },
      arch: { tabId: 'tabArch', paneId: 'paneArch', frameId: 'frameArch', btnText: 'Export Architecture Spec JPG' }
    };

    function switchScope(scopeKey) {
      currentScope = scopeKey;
      Object.keys(tabMap).forEach(key => {
        const item = tabMap[key];
        const tabEl = document.getElementById(item.tabId);
        const paneEl = document.getElementById(item.paneId);
        if (key === scopeKey) {
          tabEl.classList.add('active');
          paneEl.classList.add('active');
          document.getElementById('exportBtnTxt').innerText = item.btnText;
        } else {
          tabEl.classList.remove('active');
          paneEl.classList.remove('active');
        }
      });
    }

    function exportActiveScope() {
      const activeFrameId = tabMap[currentScope].frameId;
      const iframe = document.getElementById(activeFrameId);
      if (iframe && iframe.contentWindow && typeof iframe.contentWindow.exportCardToJpg === 'function') {
        iframe.contentWindow.exportCardToJpg();
      } else {
        alert('Exporting active scope document...');
      }
    }
  </script>
</body>
</html>
