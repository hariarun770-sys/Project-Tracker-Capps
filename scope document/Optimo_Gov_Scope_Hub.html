<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimo Gov Portal — Phase 2 Scope & Architecture Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: auto;
    }

    /* TOP UTILITY / NAV BAR */
    .top-nav-bar {
      width: 1536px;
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 18px;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 10px;
      z-index: 100;
    }

    .top-nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .top-nav-link:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #ffffff;
    }

    .scope-tabs-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .scope-tab-btn {
      padding: 6px 13px;
      font-size: 11.5px;
      font-weight: 800;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      background: transparent;
      transition: all 0.2s ease;
    }

    .scope-tab-btn:hover {
      color: #f1f5f9;
    }

    .scope-tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.45);
    }

    .top-nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-export-retina {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }

    .card-frame-container {
      width: 1536px;
      min-width: 1536px;
      display: flex;
      justify-content: center;
    }

    .scope-pane {
      display: none;
      width: 100%;
    }

    .scope-pane.active {
      display: block;
    }

    .card-frame {
      width: 1536px;
      height: 1040px;
      border: none;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- TOP UTILITY / NAV BAR -->
  <div class="top-nav-bar">
    <div class="top-nav-left">
      <a href="../index.html" class="top-nav-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Portfolio Tracker
      </a>
      <div class="scope-tabs-group">
        <button class="scope-tab-btn active" id="tabSpec" onclick="switchScope('spec')">
          <i class="fa-solid fa-diagram-project"></i> 1. Phase 2 Delivery Spec
        </button>
        <button class="scope-tab-btn" id="tabVenues" onclick="switchScope('venues')">
          <i class="fa-solid fa-building"></i> 2. Venues &amp; Assets (Catalog)
        </button>
        <button class="scope-tab-btn" id="tabTickets" onclick="switchScope('tickets')">
          <i class="fa-solid fa-headset"></i> 3. Support Tickets (Support)
        </button>
        <button class="scope-tab-btn" id="tabKb" onclick="switchScope('kb')">
          <i class="fa-solid fa-book-open"></i> 4. Knowledge Base (Support)
        </button>
      </div>
    </div>
    <div class="top-nav-actions">
      <button class="btn-export-retina" onclick="exportActiveScope()">
        <i class="fa-solid fa-camera"></i> <span id="exportBtnTxt">Export Scope Spec JPG</span>
      </button>
    </div>
  </div>

  <div class="card-frame-container">
    <!-- Pane 1: Phase 2 Delivery Spec -->
    <div class="scope-pane active" id="paneSpec">
      <iframe class="card-frame" id="frameSpec" src="Optimo_Gov_Portal_Scope_Document.html"></iframe>
    </div>

    <!-- Pane 2: Venues & Assets -->
    <div class="scope-pane" id="paneVenues">
      <iframe class="card-frame" id="frameVenues" src="Optimo_Venues_Assets_Scope_Document.html"></iframe>
    </div>

    <!-- Pane 3: Support Tickets -->
    <div class="scope-pane" id="paneTickets">
      <iframe class="card-frame" id="frameTickets" src="Optimo_Support_Tickets_Scope_Document.html"></iframe>
    </div>

    <!-- Pane 4: Knowledge Base -->
    <div class="scope-pane" id="paneKb">
      <iframe class="card-frame" id="frameKb" src="Optimo_Knowledge_Base_Scope_Document.html"></iframe>
    </div>
  </div>

  <script>
    let currentScope = 'spec';

    const tabMap = {
      spec: { tabId: 'tabSpec', paneId: 'paneSpec', frameId: 'frameSpec', btnText: 'Export Scope Spec JPG' },
      venues: { tabId: 'tabVenues', paneId: 'paneVenues', frameId: 'frameVenues', btnText: 'Export Venues & Assets Scope JPG' },
      tickets: { tabId: 'tabTickets', paneId: 'paneTickets', frameId: 'frameTickets', btnText: 'Export Support Tickets Scope JPG' },
      kb: { tabId: 'tabKb', paneId: 'paneKb', frameId: 'frameKb', btnText: 'Export Knowledge Base Scope JPG' }
    };

    function switchScope(scopeKey) {
      currentScope = scopeKey;
      Object.keys(tabMap).forEach(key => {
        const item = tabMap[key];
        const tabEl = document.getElementById(item.tabId);
        const paneEl = document.getElementById(item.paneId);
        if (key === scopeKey) {
          tabEl.classList.add('active');
          paneEl.classList.add('active');
          document.getElementById('exportBtnTxt').innerText = item.btnText;
        } else {
          tabEl.classList.remove('active');
          paneEl.classList.remove('active');
        }
      });
    }

    function exportActiveScope() {
      const activeFrameId = tabMap[currentScope].frameId;
      const iframe = document.getElementById(activeFrameId);
      if (iframe && iframe.contentWindow && typeof iframe.contentWindow.exportCardToJpg === 'function') {
        iframe.contentWindow.exportCardToJpg();
      } else {
        alert('Exporting active scope document...');
      }
    }
  </script>
</body>
</html>
